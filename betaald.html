<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Betaling controleren</title><style>body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at top left,#20336b 0,#0d1224 40%,#070a15 100%);color:#f5f7ff;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,92vw);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}h1{font-size:34px;margin:0 0 12px}p{color:#a9b4d6;line-height:1.55}.btn{display:inline-block;margin-top:16px;border-radius:16px;padding:14px 18px;font-weight:800;text-decoration:none;color:#07101f;background:linear-gradient(135deg,#36d1dc,#5b86e5)}</style></head><body><div class="box"><h1>We controleren je betaling…</h1><p id="status">Dit kan enkele seconden duren. Sluit dit venster niet.</p><a class="btn" href="/" id="go" style="display:none">Start met oefenen</a></div><script>
const params=new URLSearchParams(location.search); const access=params.get('access'); const statusEl=document.getElementById('status'), go=document.getElementById('go');
async function check(){ if(!access){statusEl.textContent='Geen toegangscode gevonden. Ga terug naar de website en probeer opnieuw.';return;} try{ const res=await fetch('/api/check-access?access='+encodeURIComponent(access)); const data=await res.json(); if(data.valid){ localStorage.setItem('rijbewijs_access_token',access); if(data.expiresAt) localStorage.setItem('rijbewijs_access_until',data.expiresAt); statusEl.textContent='Betaling ontvangen. Je toegang is actief.'; go.style.display='inline-block'; setTimeout(()=>location.href='/',1200); return;} statusEl.textContent=data.status==='pending'?'Betaling nog niet bevestigd. We controleren opnieuw…':'Betaling nog niet afgerond of geweigerd.'; setTimeout(check,2500);}catch(e){statusEl.textContent='Controle mislukt. We proberen opnieuw…'; setTimeout(check,3000);} }
check();</script></body></html>
