<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>De Baan Op - Tijdelijk offline</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="De Baan Op is tijdelijk offline wegens een technisch probleem." />

  <style>
    :root {
      --bg: #07111f;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: #b9c4d6;
      --accent: #4fd1ff;
      --accent-2: #5b8cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(79, 209, 255, 0.22), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(91, 140, 255, 0.18), transparent 34%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 44px 34px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 34px;
      box-shadow: 0 12px 34px rgba(79, 209, 255, 0.28);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto 16px;
      max-width: 580px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #dce7ff;
      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ffce4f;
      box-shadow: 0 0 18px rgba(255, 206, 79, 0.8);
    }

    a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid var(--accent);
    }

    a:hover {
      color: var(--accent);
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #8fa0bd;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🚗</div>

    <h1>We zijn tijdelijk offline</h1>

    <div class="status">
      <span class="dot"></span>
      Technisch probleem
    </div>

    <p>
      We werken momenteel aan een technisch probleem op de website.
      We doen ons best om zo snel mogelijk opnieuw online te zijn.
    </p>

    <p>
      Heb je intussen een vraag? Mail ons gerust via
      <a href="mailto:info@debaanop.eu">info@debaanop.eu</a>.
    </p>

    <div class="footer">
      De Baan Op
    </div>
  </main>
</body>
</html>
